<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Careers Admin - Copperhead Labs</title>
    <link rel="icon" type="image/svg+xml" href="logos/copperhead.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&display=block" rel="stylesheet">
    <style>
        :root {
            --copper: #b87333;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        [hidden] { display: none !important; }

        body {
            font-family: 'Montserrat', sans-serif;
            background: #0d0d0d;
            color: #fff;
            min-height: 100vh;
        }

        .login-screen {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 50%, #0d0d0d 100%);
            position: relative;
            padding: 1.5rem;
        }

        .login-screen::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 20% 80%, rgba(184, 115, 51, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(184, 115, 51, 0.08) 0%, transparent 40%);
            pointer-events: none;
        }

        .login-box {
            background: rgba(20, 20, 20, 0.92);
            border: 1px solid rgba(184, 115, 51, 0.2);
            border-radius: 16px;
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 420px;
            position: relative;
            z-index: 1;
        }

        .login-logo { text-align: center; margin-bottom: 1.5rem; }
        .login-logo img { width: 72px; height: 72px; }

        .login-box h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.4rem;
            text-align: center;
            margin-bottom: 0.4rem;
        }

        .login-box > p {
            text-align: center;
            color: #888;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
        }

        .form-group { margin-bottom: 1.1rem; }

        .form-group label,
        .field-label {
            display: block;
            margin-bottom: 0.45rem;
            font-weight: 600;
            color: #ccc;
            font-size: 0.88rem;
        }

        .form-group input,
        .form-group textarea,
        .form-group select,
        .toolbar input,
        .toolbar select {
            width: 100%;
            padding: 0.8rem 0.9rem;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            font-family: inherit;
        }

        .form-group textarea { min-height: 140px; resize: vertical; line-height: 1.6; }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus,
        .toolbar input:focus,
        .toolbar select:focus {
            outline: none;
            border-color: var(--copper);
        }

        .form-group select option,
        .toolbar select option { background: #1a1a1a; color: #fff; }

        .hint { color: #777; font-size: 0.8rem; margin-top: 0.35rem; }

        .btn {
            padding: 0.8rem 1.1rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.88rem;
            cursor: pointer;
            border: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            text-decoration: none;
            color: inherit;
            font-family: inherit;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--copper) 0%, #9a5429 100%);
            color: #fff;
        }

        .btn-primary:hover { box-shadow: 0 8px 25px rgba(184, 115, 51, 0.35); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; box-shadow: none; }

        .login-form button { width: 100%; }

        .btn-secondary { background: rgba(255, 255, 255, 0.1); color: #ddd; }
        .btn-secondary:hover { background: rgba(255, 255, 255, 0.16); color: #fff; }
        .btn-danger { background: rgba(220, 53, 69, 0.2); color: #ff8b8b; }
        .btn-danger:hover { background: rgba(220, 53, 69, 0.32); }

        .login-error {
            display: none;
            background: rgba(220, 53, 69, 0.2);
            border: 1px solid rgba(220, 53, 69, 0.5);
            color: #ff6b6b;
            padding: 0.75rem;
            border-radius: 6px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            text-align: center;
        }

        .login-error.show { display: block; }

        .admin-dashboard { display: none; }

        .admin-header {
            background: rgba(10, 10, 10, 0.95);
            border-bottom: 1px solid rgba(184, 115, 51, 0.2);
            padding: 1rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .admin-header-left, .admin-header-right {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .admin-header img { height: 34px; }
        .admin-header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            color: var(--copper);
        }

        .user-email { color: #888; font-size: 0.82rem; }

        .admin-content {
            padding: 1.5rem;
            max-width: 1100px;
            margin: 0 auto;
        }

        .admin-tabs { display: flex; gap: 0.5rem; margin-bottom: 1.25rem; }

        .admin-tab {
            background: transparent;
            color: #aaa;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 999px;
            padding: 0.55rem 0.95rem;
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
        }

        .admin-tab.active {
            color: #fff;
            border-color: var(--copper);
            background: rgba(184, 115, 51, 0.18);
        }

        .tab-panel { display: none; }
        .tab-panel.active { display: block; }

        .admin-section {
            background: rgba(20, 20, 20, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            margin-bottom: 1.25rem;
            overflow: hidden;
        }

        .admin-section-header {
            padding: 1rem 1.2rem;
            background: rgba(0, 0, 0, 0.3);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }

        .admin-section-header h2 {
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.25rem;
        }

        .admin-section-body { padding: 1.2rem; }

        .form-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
        }

        .form-actions {
            display: flex;
            gap: 0.7rem;
            justify-content: flex-end;
            padding-top: 0.9rem;
            margin-top: 0.4rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 1rem;
            margin-bottom: 0.8rem;
        }

        .item-top {
            display: flex;
            justify-content: space-between;
            gap: 1rem;
            align-items: flex-start;
        }

        .item h3 {
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.15rem;
            margin-bottom: 0.35rem;
        }

        .badges { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 0.45rem; }

        .badge {
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            padding: 0.22rem 0.5rem;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.08);
            color: #bbb;
        }

        .badge.published { background: rgba(40, 167, 69, 0.2); color: #7dcea0; }
        .badge.closed { background: rgba(220, 53, 69, 0.18); color: #ff8b8b; }
        .badge.draft { background: rgba(255, 255, 255, 0.08); color: #999; }
        .badge.new { background: rgba(184, 115, 51, 0.22); color: #e0b088; }

        .preview {
            color: #999;
            font-size: 0.9rem;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .item-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            margin-top: 0.8rem;
        }

        .item-actions .btn { padding: 0.45rem 0.7rem; font-size: 0.8rem; }

        .meta-line { color: #888; font-size: 0.88rem; margin: 0.2rem 0; }
        .meta-line a { color: #e0b088; }

        .message-block {
            margin-top: 0.6rem;
            color: #ccc;
            white-space: pre-wrap;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 8px;
            padding: 0.7rem 0.8rem;
            max-height: 9rem;
            overflow: auto;
        }

        .toolbar {
            display: grid;
            grid-template-columns: 220px 1fr auto;
            gap: 0.7rem;
            margin-bottom: 1rem;
        }

        .empty-list, .loading-list { text-align: center; color: #888; padding: 2rem 1rem; }

        .loading-spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(184, 115, 51, 0.2);
            border-top-color: var(--copper);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 0.7rem;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(20, 20, 20, 0.96);
            border: 1px solid rgba(184, 115, 51, 0.5);
            border-radius: 8px;
            padding: 0.9rem 1.1rem;
            transform: translateY(120px);
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 1100;
            max-width: min(420px, calc(100% - 2rem));
        }

        .toast.show { transform: translateY(0); opacity: 1; }
        .toast.success { border-color: rgba(40, 167, 69, 0.6); }
        .toast.error { border-color: rgba(220, 53, 69, 0.7); }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 1rem;
        }

        .modal-overlay.show { display: flex; }

        .modal {
            background: #1a1a1a;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            width: 100%;
            max-width: 460px;
        }

        .modal-header, .modal-footer {
            padding: 1rem 1.1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.7rem;
        }

        .modal-header { border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
        .modal-footer { border-top: 1px solid rgba(255, 255, 255, 0.1); justify-content: flex-end; }
        .modal-header h3 { font-family: 'Rajdhani', sans-serif; font-size: 1.25rem; }
        .modal-body { padding: 1.1rem; color: #bbb; line-height: 1.6; }
        .modal-close { background: none; border: none; color: #aaa; font-size: 1.4rem; cursor: pointer; }

        @media (max-width: 800px) {
            .form-row, .toolbar { grid-template-columns: 1fr; }
            .admin-content { padding: 1rem; }
            .item-top { flex-direction: column; }
            .admin-header { align-items: flex-start; }
        }
    </style>
</head>
<body>
    <div class="login-screen" id="loginScreen">
        <div class="login-box">
            <div class="login-logo">
                <img src="logos/copperhead.svg" alt="Copperhead Labs">
            </div>
            <h1>Careers Admin</h1>
            <p>Sign in with your Copperhead staff account</p>
            <div class="login-error" id="loginError"></div>
            <form class="login-form" id="loginForm">
                <div class="form-group">
                    <label for="emailInput">Email</label>
                    <input type="email" id="emailInput" autocomplete="username" placeholder="admin@copperheadlabs.com" required>
                </div>
                <div class="form-group">
                    <label for="passwordInput">Password</label>
                    <input type="password" id="passwordInput" autocomplete="current-password" placeholder="Enter your password" required>
                </div>
                <button class="btn btn-primary" type="submit" id="loginBtn">Sign In</button>
            </form>
        </div>
    </div>

    <div class="admin-dashboard" id="adminDashboard">
        <header class="admin-header">
            <div class="admin-header-left">
                <img src="logos/copperhead.svg" alt="Copperhead Labs">
                <h1>Careers Admin</h1>
            </div>
            <div class="admin-header-right">
                <span class="user-email" id="userEmail"></span>
                <a href="careers.html" class="btn btn-secondary" target="_blank" rel="noopener">View public page</a>
                <a href="updates-admin.html" class="btn btn-secondary">Updates admin</a>
                <button class="btn btn-secondary" id="logoutBtn" type="button">Sign out</button>
            </div>
        </header>

        <div class="admin-content">
            <div class="admin-tabs">
                <button class="admin-tab active" type="button" data-tab="postings">Job postings</button>
                <button class="admin-tab" type="button" data-tab="applications" id="applicationsTab">Applications</button>
            </div>

            <section class="tab-panel active" id="panel-postings">
                <div class="admin-section">
                    <div class="admin-section-header">
                        <h2 id="formTitle">Add a job posting</h2>
                    </div>
                    <div class="admin-section-body">
                        <form id="jobForm">
                            <div class="form-group">
                                <label for="jobTitle">Title</label>
                                <input type="text" id="jobTitle" maxlength="160" required placeholder="Calibration Technician">
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label for="jobLocation">Location</label>
                                    <input type="text" id="jobLocation" maxlength="120" required placeholder="Decatur, AL">
                                </div>
                                <div class="form-group">
                                    <label for="jobType">Employment type</label>
                                    <select id="jobType" required>
                                        <option value="full-time">Full-time</option>
                                        <option value="part-time">Part-time</option>
                                        <option value="contract">Contract</option>
                                        <option value="temporary">Temporary</option>
                                        <option value="internship">Internship</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label for="jobStatus">Status</label>
                                    <select id="jobStatus">
                                        <option value="draft">Draft (hidden)</option>
                                        <option value="published">Published (open)</option>
                                        <option value="closed">Closed (hidden)</option>
                                    </select>
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label for="payMin">Pay minimum <span style="color:#777;">(optional)</span></label>
                                    <input type="number" id="payMin" min="0" step="0.01" placeholder="25">
                                </div>
                                <div class="form-group">
                                    <label for="payMax">Pay maximum <span style="color:#777;">(optional)</span></label>
                                    <input type="number" id="payMax" min="0" step="0.01" placeholder="32">
                                </div>
                                <div class="form-group">
                                    <label for="payPeriod">Pay period</label>
                                    <select id="payPeriod">
                                        <option value="">Not listed</option>
                                        <option value="hour">Per hour</option>
                                        <option value="year">Per year</option>
                                    </select>
                                    <p class="hint">Leave pay blank to hide the range. If you enter a number, choose a period.</p>
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="jobDescription">Description</label>
                                <textarea id="jobDescription" maxlength="20000" required placeholder="What the person will do. Separate paragraphs with a blank line. Start a line with - to make a bullet."></textarea>
                            </div>
                            <div class="form-group">
                                <label for="jobRequirements">Requirements <span style="color:#777;">(optional)</span></label>
                                <textarea id="jobRequirements" maxlength="20000" placeholder="- High school diploma or equivalent&#10;- Comfortable working in a lab"></textarea>
                            </div>
                            <div class="form-actions">
                                <button type="button" class="btn btn-secondary" id="cancelEdit" hidden>Cancel</button>
                                <button type="submit" class="btn btn-primary" id="saveJobBtn">Save posting</button>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="admin-section">
                    <div class="admin-section-header">
                        <h2>All postings</h2>
                        <span id="jobCount" style="color:#888;font-size:0.9rem;">0</span>
                    </div>
                    <div class="admin-section-body">
                        <div id="jobsList">
                            <div class="loading-list"><div class="loading-spinner"></div><p>Loading postings...</p></div>
                        </div>
                    </div>
                </div>
            </section>

            <section class="tab-panel" id="panel-applications">
                <div class="admin-section">
                    <div class="admin-section-header">
                        <h2>Submitted applications</h2>
                        <button class="btn btn-secondary" type="button" id="refreshApplications">Refresh</button>
                    </div>
                    <div class="admin-section-body">
                        <div class="toolbar">
                            <select id="applicationFilter" aria-label="Filter by posting">
                                <option value="all">All positions</option>
                                <option value="general">General applications</option>
                            </select>
                            <input type="search" id="applicationSearch" placeholder="Search name, email, or phone" aria-label="Search applications">
                            <span id="applicationCount" style="color:#888;align-self:center;font-size:0.9rem;"></span>
                        </div>
                        <div id="applicationsList">
                            <div class="loading-list"><div class="loading-spinner"></div><p>Loading applications...</p></div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <div class="modal-overlay" id="confirmModal">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
            <div class="modal-header">
                <h3 id="confirmTitle">Confirm</h3>
                <button class="modal-close" type="button" id="confirmClose" aria-label="Close">&times;</button>
            </div>
            <div class="modal-body"><p id="confirmBody"></p></div>
            <div class="modal-footer">
                <button class="btn btn-secondary" type="button" id="confirmCancel">Cancel</button>
                <button class="btn btn-danger" type="button" id="confirmOk">Confirm</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast" role="status"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script>
        const CareersAdmin = {
            user: null,
            editingId: null,
            jobs: [],
            applications: [],
            confirmAction: null,

            async init() {
                this.bindEvents();
                await this.checkAuth();
            },

            bindEvents() {
                document.getElementById('loginForm').addEventListener('submit', (event) => this.handleLogin(event));
                document.getElementById('logoutBtn').addEventListener('click', () => supabase.auth.signOut());
                document.getElementById('jobForm').addEventListener('submit', (event) => this.saveJob(event));
                document.getElementById('cancelEdit').addEventListener('click', () => this.resetForm());
                document.getElementById('refreshApplications').addEventListener('click', () => this.loadApplications());
                document.getElementById('applicationFilter').addEventListener('change', () => this.renderApplications());
                document.getElementById('applicationSearch').addEventListener('input', () => this.renderApplications());
                document.querySelectorAll('.admin-tab').forEach((tab) => {
                    tab.addEventListener('click', () => this.showTab(tab.getAttribute('data-tab')));
                });
                document.getElementById('jobsList').addEventListener('click', (event) => this.onJobClick(event));
                document.getElementById('applicationsList').addEventListener('click', (event) => this.onApplicationClick(event));
                document.getElementById('confirmCancel').addEventListener('click', () => this.closeConfirm());
                document.getElementById('confirmClose').addEventListener('click', () => this.closeConfirm());
                document.getElementById('confirmOk').addEventListener('click', () => this.runConfirm());
            },

            async checkAuth() {
                try {
                    const { data: { session } } = await supabase.auth.getSession();
                    if (session) {
                        this.user = session.user;
                        this.showDashboard();
                    }
                    supabase.auth.onAuthStateChange((event, session) => {
                        if (event === 'SIGNED_OUT') location.reload();
                        if (event === 'SIGNED_IN' && session && !this.user) {
                            this.user = session.user;
                            this.showDashboard();
                        }
                    });
                } catch (error) {
                    this.showLoginError(error.message || 'Unable to reach the sign-in service.');
                }
            },

            async handleLogin(event) {
                event.preventDefault();
                const button = document.getElementById('loginBtn');
                const email = document.getElementById('emailInput').value.trim();
                const password = document.getElementById('passwordInput').value;
                button.disabled = true;
                button.textContent = 'Signing in...';
                document.getElementById('loginError').classList.remove('show');
                try {
                    const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                    if (error) throw error;
                    this.user = data.user;
                    this.showDashboard();
                } catch (error) {
                    this.showLoginError(error.message || 'Invalid email or password');
                } finally {
                    button.disabled = false;
                    button.textContent = 'Sign In';
                }
            },

            showLoginError(message) {
                const el = document.getElementById('loginError');
                el.textContent = message;
                el.classList.add('show');
            },

            showDashboard() {
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('adminDashboard').style.display = 'block';
                document.getElementById('userEmail').textContent = this.user.email || '';
                this.loadJobs();
                this.loadApplications();
            },

            showTab(name) {
                document.querySelectorAll('.admin-tab').forEach((tab) => {
                    tab.classList.toggle('active', tab.getAttribute('data-tab') === name);
                });
                document.querySelectorAll('.tab-panel').forEach((panel) => {
                    panel.classList.toggle('active', panel.id === `panel-${name}`);
                });
            },

            async loadJobs() {
                const list = document.getElementById('jobsList');
                try {
                    const { data, error } = await supabase
                        .from('job_postings')
                        .select('*')
                        .order('created_at', { ascending: false });
                    if (error) throw error;
                    this.jobs = data || [];
                    this.renderJobs();
                    this.fillApplicationFilter();
                } catch (error) {
                    list.innerHTML = `<div class="empty-list">Could not load postings. ${this.escapeHtml(error.message)}</div>`;
                }
            },

            renderJobs() {
                const list = document.getElementById('jobsList');
                document.getElementById('jobCount').textContent = `${this.jobs.length} posting${this.jobs.length === 1 ? '' : 's'}`;
                if (!this.jobs.length) {
                    list.innerHTML = '<div class="empty-list"><h3>No postings yet</h3><p>Add the first one with the form above.</p></div>';
                    return;
                }
                list.innerHTML = this.jobs.map((job) => `
                    <article class="item">
                        <div class="item-top">
                            <div>
                                <h3>${this.escapeHtml(job.title)}</h3>
                                <div class="badges">
                                    <span class="badge ${this.escapeHtml(job.status)}">${this.escapeHtml(this.statusLabel(job.status))}</span>
                                    <span class="badge">${this.escapeHtml(job.location)}</span>
                                    <span class="badge">${this.escapeHtml(this.employmentLabel(job.employment_type))}</span>
                                    ${this.formatPay(job) ? `<span class="badge">${this.escapeHtml(this.formatPay(job))}</span>` : ''}
                                </div>
                                <p class="preview">${this.escapeHtml(job.description)}</p>
                            </div>
                        </div>
                        <div class="item-actions">
                            <button class="btn btn-secondary" type="button" data-action="edit" data-id="${this.escapeHtml(job.id)}">Edit</button>
                            ${job.status !== 'published' ? `<button class="btn btn-secondary" type="button" data-action="status" data-status="published" data-id="${this.escapeHtml(job.id)}">Publish</button>` : ''}
                            ${job.status === 'published' ? `<button class="btn btn-secondary" type="button" data-action="status" data-status="draft" data-id="${this.escapeHtml(job.id)}">Unpublish</button>` : ''}
                            ${job.status === 'published' ? `<button class="btn btn-secondary" type="button" data-action="status" data-status="closed" data-id="${this.escapeHtml(job.id)}">Close</button>` : ''}
                            ${job.status === 'closed' ? `<button class="btn btn-secondary" type="button" data-action="status" data-status="published" data-id="${this.escapeHtml(job.id)}">Reopen</button>` : ''}
                            <button class="btn btn-danger" type="button" data-action="delete" data-id="${this.escapeHtml(job.id)}">Delete</button>
                        </div>
                    </article>
                `).join('');
            },

            onJobClick(event) {
                const button = event.target.closest('[data-action]');
                if (!button) return;
                const id = button.getAttribute('data-id');
                const action = button.getAttribute('data-action');
                if (action === 'edit') this.editJob(id);
                if (action === 'status') this.setStatus(id, button.getAttribute('data-status'));
                if (action === 'delete') {
                    const job = this.jobs.find((item) => item.id === id);
                    this.askConfirm({
                        title: 'Delete posting',
                        body: `Delete “${job ? job.title : 'this posting'}”? Applications already received stay in the inbox, with the job title kept on each one.`,
                        label: 'Delete',
                        action: () => this.deleteJob(id)
                    });
                }
            },

            editJob(id) {
                const job = this.jobs.find((item) => item.id === id);
                if (!job) return;
                this.editingId = id;
                document.getElementById('jobTitle').value = job.title;
                document.getElementById('jobLocation').value = job.location;
                document.getElementById('jobType').value = job.employment_type;
                document.getElementById('jobStatus').value = job.status;
                document.getElementById('payMin').value = this.numInput(job.pay_min);
                document.getElementById('payMax').value = this.numInput(job.pay_max);
                document.getElementById('payPeriod').value = job.pay_period || '';
                document.getElementById('jobDescription').value = job.description || '';
                document.getElementById('jobRequirements').value = job.requirements || '';
                document.getElementById('formTitle').textContent = 'Edit job posting';
                document.getElementById('saveJobBtn').textContent = 'Save changes';
                document.getElementById('cancelEdit').hidden = false;
                this.showTab('postings');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            },

            async saveJob(event) {
                event.preventDefault();
                const button = document.getElementById('saveJobBtn');
                let payload;
                try {
                    payload = this.readJobForm();
                } catch (error) {
                    this.toast(error.message, 'error');
                    return;
                }
                button.disabled = true;
                try {
                    if (this.editingId) {
                        const { error } = await supabase.from('job_postings').update(payload).eq('id', this.editingId);
                        if (error) throw error;
                        this.toast('Posting saved.', 'success');
                    } else {
                        const { error } = await supabase.from('job_postings').insert(payload);
                        if (error) throw error;
                        this.toast('Posting added.', 'success');
                    }
                    this.resetForm();
                    await this.loadJobs();
                } catch (error) {
                    this.toast(error.message || 'Could not save the posting.', 'error');
                } finally {
                    button.disabled = false;
                }
            },

            readJobForm() {
                const title = document.getElementById('jobTitle').value.trim();
                const location = document.getElementById('jobLocation').value.trim();
                const description = document.getElementById('jobDescription').value.trim();
                const requirements = document.getElementById('jobRequirements').value.trim();
                const payMin = this.optionalNumber('payMin');
                const payMax = this.optionalNumber('payMax');
                const payPeriod = document.getElementById('payPeriod').value || null;
                if (title.length < 2) throw new Error('Enter a job title.');
                if (location.length < 2) throw new Error('Enter a location.');
                if (!description) throw new Error('Enter a description.');
                if ((payMin != null || payMax != null) && !payPeriod) {
                    throw new Error('Choose a pay period, or clear the pay fields.');
                }
                if (payMin == null && payMax == null && payPeriod) {
                    throw new Error('Enter a pay amount, or set the period to “Not listed”.');
                }
                if (payMin != null && payMax != null && payMin > payMax) {
                    throw new Error('The pay minimum cannot be higher than the maximum.');
                }
                return {
                    title,
                    location,
                    employment_type: document.getElementById('jobType').value,
                    status: document.getElementById('jobStatus').value,
                    pay_min: payMin,
                    pay_max: payMax,
                    pay_period: payMin == null && payMax == null ? null : payPeriod,
                    description,
                    requirements: requirements || null
                };
            },

            optionalNumber(id) {
                const raw = document.getElementById(id).value.trim();
                if (!raw) return null;
                const value = Number(raw);
                if (!Number.isFinite(value) || value < 0) throw new Error('Pay amounts must be zero or greater.');
                return value;
            },

            async setStatus(id, status) {
                const { error } = await supabase.from('job_postings').update({ status }).eq('id', id);
                if (error) {
                    this.toast(error.message, 'error');
                    return;
                }
                this.toast(`Posting marked ${this.statusLabel(status).toLowerCase()}.`, 'success');
                await this.loadJobs();
            },

            async deleteJob(id) {
                const { error } = await supabase.from('job_postings').delete().eq('id', id);
                if (error) {
                    this.toast(error.message, 'error');
                    return;
                }
                if (this.editingId === id) this.resetForm();
                this.toast('Posting deleted.', 'success');
                await this.loadJobs();
            },

            resetForm() {
                this.editingId = null;
                document.getElementById('jobForm').reset();
                document.getElementById('jobStatus').value = 'draft';
                document.getElementById('formTitle').textContent = 'Add a job posting';
                document.getElementById('saveJobBtn').textContent = 'Save posting';
                document.getElementById('cancelEdit').hidden = true;
            },

            async loadApplications() {
                const list = document.getElementById('applicationsList');
                try {
                    const { data, error } = await supabase
                        .from('job_applications')
                        .select('id, job_id, job_title_snapshot, applicant_name, email, phone, message, resume_path, resume_filename, reviewed, created_at')
                        .order('created_at', { ascending: false })
                        .limit(500);
                    if (error) throw error;
                    this.applications = data || [];
                    this.renderApplications();
                } catch (error) {
                    list.innerHTML = `<div class="empty-list">Could not load applications. ${this.escapeHtml(error.message)}</div>`;
                }
            },

            fillApplicationFilter() {
                const select = document.getElementById('applicationFilter');
                const current = select.value;
                const options = ['<option value="all">All positions</option>', '<option value="general">General applications</option>'];
                this.jobs.forEach((job) => {
                    options.push(`<option value="${this.escapeHtml(job.id)}">${this.escapeHtml(job.title)}</option>`);
                });
                select.innerHTML = options.join('');
                if ([...select.options].some((option) => option.value === current)) select.value = current;
            },

            visibleApplications() {
                const filter = document.getElementById('applicationFilter').value;
                const query = document.getElementById('applicationSearch').value.trim().toLowerCase();
                return this.applications.filter((app) => {
                    if (filter === 'general' && app.job_id) return false;
                    if (filter !== 'all' && filter !== 'general' && app.job_id !== filter) return false;
                    if (!query) return true;
                    const haystack = `${app.applicant_name} ${app.email} ${app.phone} ${app.job_title_snapshot}`.toLowerCase();
                    return haystack.includes(query);
                });
            },

            renderApplications() {
                const list = document.getElementById('applicationsList');
                const visible = this.visibleApplications();
                const unread = this.applications.filter((app) => !app.reviewed).length;
                document.getElementById('applicationsTab').textContent = unread
                    ? `Applications (${unread} new)`
                    : 'Applications';
                document.getElementById('applicationCount').textContent = `${visible.length} shown`;
                if (!visible.length) {
                    list.innerHTML = '<div class="empty-list">No applications match this view.</div>';
                    return;
                }
                list.innerHTML = visible.map((app) => `
                    <article class="item">
                        <div class="item-top">
                            <div>
                                <h3>${this.escapeHtml(app.applicant_name)}</h3>
                                <div class="badges">
                                    <span class="badge ${app.reviewed ? '' : 'new'}">${app.reviewed ? 'Reviewed' : 'New'}</span>
                                    <span class="badge">${this.escapeHtml(app.job_title_snapshot || 'General application')}</span>
                                </div>
                                <p class="meta-line"><a href="mailto:${this.escapeHtml(app.email)}">${this.escapeHtml(app.email)}</a></p>
                                <p class="meta-line"><a href="tel:${this.escapeHtml(String(app.phone).replace(/[^\d+]/g, ''))}">${this.escapeHtml(app.phone)}</a></p>
                                <p class="meta-line">${this.escapeHtml(this.formatWhen(app.created_at))} · ${this.escapeHtml(app.resume_filename || 'Resume')}</p>
                                ${app.message ? `<div class="message-block">${this.escapeHtml(app.message)}</div>` : ''}
                            </div>
                        </div>
                        <div class="item-actions">
                            <button class="btn btn-primary" type="button" data-action="download" data-id="${this.escapeHtml(app.id)}">Download resume</button>
                            <button class="btn btn-secondary" type="button" data-action="reviewed" data-id="${this.escapeHtml(app.id)}">${app.reviewed ? 'Mark as new' : 'Mark reviewed'}</button>
                            <button class="btn btn-danger" type="button" data-action="delete" data-id="${this.escapeHtml(app.id)}">Delete</button>
                        </div>
                    </article>
                `).join('');
            },

            onApplicationClick(event) {
                const button = event.target.closest('[data-action]');
                if (!button) return;
                const id = button.getAttribute('data-id');
                const app = this.applications.find((item) => item.id === id);
                if (!app) return;
                const action = button.getAttribute('data-action');
                if (action === 'download') this.downloadResume(app);
                if (action === 'reviewed') this.setReviewed(app, !app.reviewed);
                if (action === 'delete') {
                    this.askConfirm({
                        title: 'Delete application',
                        body: `Delete ${app.applicant_name}'s application and resume? This cannot be undone.`,
                        label: 'Delete',
                        action: () => this.deleteApplication(app)
                    });
                }
            },

            async downloadResume(app) {
                if (!app.resume_path) {
                    this.toast('This application has no resume on file.', 'error');
                    return;
                }
                const { data, error } = await supabase.storage
                    .from('resumes')
                    .createSignedUrl(app.resume_path, 120, { download: app.resume_filename || true });
                if (error || !data || !data.signedUrl) {
                    this.toast((error && error.message) || 'Could not create a download link.', 'error');
                    return;
                }
                const link = document.createElement('a');
                link.href = data.signedUrl;
                link.target = '_blank';
                link.rel = 'noopener';
                document.body.appendChild(link);
                link.click();
                link.remove();
            },

            async setReviewed(app, reviewed) {
                const { error } = await supabase.from('job_applications').update({ reviewed }).eq('id', app.id);
                if (error) {
                    this.toast(error.message, 'error');
                    return;
                }
                app.reviewed = reviewed;
                this.renderApplications();
            },

            async deleteApplication(app) {
                if (app.resume_path) {
                    const { error: storageError } = await supabase.storage.from('resumes').remove([app.resume_path]);
                    if (storageError) console.error(storageError);
                }
                const { error } = await supabase.from('job_applications').delete().eq('id', app.id);
                if (error) {
                    this.toast(error.message, 'error');
                    return;
                }
                this.toast('Application deleted.', 'success');
                await this.loadApplications();
            },

            askConfirm({ title, body, label, action }) {
                this.confirmAction = action;
                document.getElementById('confirmTitle').textContent = title;
                document.getElementById('confirmBody').textContent = body;
                document.getElementById('confirmOk').textContent = label || 'Confirm';
                document.getElementById('confirmModal').classList.add('show');
            },

            closeConfirm() {
                this.confirmAction = null;
                document.getElementById('confirmModal').classList.remove('show');
            },

            async runConfirm() {
                const action = this.confirmAction;
                this.closeConfirm();
                if (action) await action();
            },

            statusLabel(status) {
                return { draft: 'Draft', published: 'Published', closed: 'Closed' }[status] || status;
            },

            employmentLabel(type) {
                return {
                    'full-time': 'Full-time',
                    'part-time': 'Part-time',
                    contract: 'Contract',
                    temporary: 'Temporary',
                    internship: 'Internship'
                }[type] || type;
            },

            formatPay(job) {
                if (job.pay_min == null && job.pay_max == null) return '';
                const period = job.pay_period === 'hour' ? 'hour' : 'year';
                const money = (amount) => Number(amount).toLocaleString('en-US', {
                    style: 'currency',
                    currency: 'USD',
                    maximumFractionDigits: period === 'hour' ? 2 : 0
                });
                if (job.pay_min != null && job.pay_max != null) return `${money(job.pay_min)} – ${money(job.pay_max)} / ${period}`;
                if (job.pay_min != null) return `From ${money(job.pay_min)} / ${period}`;
                return `Up to ${money(job.pay_max)} / ${period}`;
            },

            formatWhen(value) {
                const date = new Date(value);
                if (Number.isNaN(date.getTime())) return '';
                return date.toLocaleString('en-US', {
                    year: 'numeric', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit'
                });
            },

            numInput(value) {
                if (value == null || value === '') return '';
                const number = Number(value);
                return Number.isFinite(number) ? String(number) : '';
            },

            escapeHtml(value) {
                return String(value ?? '')
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#39;');
            },

            toast(message, type) {
                const el = document.getElementById('toast');
                el.textContent = message;
                el.className = `toast show ${type || ''}`;
                clearTimeout(this.toastTimer);
                this.toastTimer = setTimeout(() => el.classList.remove('show'), 3200);
            }
        };

        document.addEventListener('DOMContentLoaded', () => CareersAdmin.init());
    </script>
</body>
</html>
